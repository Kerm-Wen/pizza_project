# 1. 伺服器連接埠設定 (預設是 8080)
server.port=8080

# 2. MySQL 資料庫連線設定
# 請把其中的 pizza_db 改成你打算使用的資料庫名稱
spring.datasource.url=jdbc:mysql://localhost:3306/pizza_db?useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=UTF-8

# 請輸入你 MySQL 的帳號 (通常預設是 root)
spring.datasource.username=root

# 請輸入你 MySQL 的密碼 (如果安裝時沒設密碼，可以留空或填你的密碼)
spring.datasource.password=sun715004

# 載入 MySQL 驅動程式
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. JPA / Hibernate 設定
# update 代表每次專案啟動時，會自動幫你檢查並建立/更新資料表，非常適合開發期使用
spring.jpa.hibernate.ddl-auto=update

# 在控制台印出執行的 SQL 語法，方便你觀察與除錯
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true