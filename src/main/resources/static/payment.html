<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💳 線上金流付款確認</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdf8f5;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .pay-card {
            background: #fff;
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin: 20px;
        }
        .pay-header {
            padding: 20px;
            color: #fff;
            text-align: center;
            background-color: #e65100;
        }
        .pay-header.line-pay {
            background-color: #06c755;
        }
        .pay-header.newebpay {
            background-color: #1565c0;
        }
        .pay-header h2 {
            margin: 0;
            font-size: 22px;
        }
        .pay-header p {
            margin: 6px 0 0;
            font-size: 13px;
            opacity: 0.92;
        }
        .pay-body {
            padding: 24px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
            font-size: 15px;
        }
        .info-row strong {
            color: #555;
        }
        .amount-text {
            font-size: 20px;
            font-weight: bold;
            color: #d84315;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 24px;
        }
        .btn-pay {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #2e7d32;
            cursor: pointer;
        }
        .btn-pay:hover {
            background-color: #1b5e20;
        }
        .btn-pay:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
        .btn-back {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            background-color: #fff;
            color: #555;
            cursor: pointer;
        }
        .btn-back:hover {
            background-color: #f5f5f5;
        }
        .status-msg {
            margin-top: 14px;
            font-size: 13px;
            text-align: center;
            color: #666;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div class="pay-card">
    <div id="pay-header" class="pay-header">
        <h2 id="pay-title">線上金流付款</h2>
        <p id="pay-subtitle">請確認您的訂單資訊並完成付款</p>
    </div>

    <div class="pay-body">
        <div class="info-row">
            <strong>訂單編號</strong>
            <span id="order-id-text">#-</span>
        </div>
        <div class="info-row">
            <strong>付款方式</strong>
            <span id="method-text">-</span>
        </div>
        <div class="info-row">
            <strong>應付金額</strong>
            <span id="amount-text" class="amount-text">NT$ 0</span>
        </div>

        <div class="btn-group">
            <button id="confirm-pay-btn" class="btn-pay" onclick="confirmPayment()">
                ✅ 確認付款完成
            </button>
            <button class="btn-back" onclick="backToCustomer()">
                返回點餐頁（稍後再付）
            </button>
        </div>

        <div id="status-msg" class="status-msg"></div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');
    const method = params.get('method') || 'ONLINE';
    const amount = params.get('amount') || '0';

    window.addEventListener('DOMContentLoaded', () => {
        const header = document.getElementById('pay-header');
        const title = document.getElementById('pay-title');
        const subtitle = document.getElementById('pay-subtitle');
        const methodText = document.getElementById('method-text');

        document.getElementById('order-id-text').textContent = orderId ? `#${orderId}` : '未提供';
        document.getElementById('amount-text').textContent = `NT$ ${amount}`;

        if (method === 'LINE_PAY') {
            header.classList.add('line-pay');
            title.textContent = '💚 LINE Pay 付款模擬';
            subtitle.textContent = '請於 LINE Pay 確認畫面完成交易';
            methodText.textContent = 'LINE Pay 線上支付';
        } else if (method === 'NEWEBPAY') {
            header.classList.add('newebpay');
            title.textContent = '💳 藍新金流付款模擬';
            subtitle.textContent = '藍新金流 MPG 安全支付確認';
            methodText.textContent = '藍新金流 (NewebPay)';
        } else {
            methodText.textContent = method;
        }

        if (!orderId) {
            document.getElementById('confirm-pay-btn').disabled = true;
            document.getElementById('status-msg').textContent = '缺少訂單編號，無法執行付款。';
        }
    });

    async function confirmPayment() {
        if (!orderId) return;

        const btn = document.getElementById('confirm-pay-btn');
        const msg = document.getElementById('status-msg');
        btn.disabled = true;
        msg.textContent = '正在向後端確認付款狀態...';

        try {
            const response = await fetch(`/api/orders/${orderId}/pay`, {
                method: 'PATCH'
            });
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || '付款狀態更新失敗');
            }

            alert(`🎉 付款成功！訂單 #${orderId} 已更新為 PAID。`);
            window.location.href = 'customer.html';
        } catch (error) {
            console.error('付款確認失敗:', error);
            msg.style.color = '#c62828';
            msg.textContent = '❌ ' + error.message;
            btn.disabled = false;
        }
    }

    function backToCustomer() {
        window.location.href = 'customer.html';
    }
</script>

</body>
</html>
