<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧑‍🍳 店家後台登入 - 美味饗宴</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f1ee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #fff;
            padding: 36px 32px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 380px;
            border-top: 6px solid #bf360c;
        }
        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-header h2 {
            margin: 0 0 6px 0;
            color: #bf360c;
            font-size: 24px;
        }
        .login-header p {
            margin: 0;
            color: #777;
            font-size: 13px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #444;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #bf360c;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #bf360c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background-color: #870000;
        }
        .error-msg {
            color: #c62828;
            background: #ffebee;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 14px;
            display: none;
            text-align: center;
        }
        .footer-link {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
        }
        .footer-link a {
            color: #777;
            text-decoration: none;
        }
        .footer-link a:hover {
            color: #bf360c;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h2>🧑‍🍳 店家後台管理登入</h2>
        <p>僅限授權業主與管理員帳號存取</p>
    </div>

    <div id="error-box" class="error-msg"></div>

    <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
            <label for="account">管理員帳號</label>
            <input type="text" id="account" placeholder="請輸入業主帳號" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">密碼</label>
            <input type="password" id="password" placeholder="請輸入密碼" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login">登入後台系統</button>
    </form>

    <div class="footer-link">
        <a href="login.html">← 返回一般顧客登入頁</a>
    </div>
</div>

<script>
    async function handleAdminLogin(event) {
        event.preventDefault();
        const errorBox = document.getElementById('error-box');
        errorBox.style.display = 'none';

        const account = document.getElementById('account').value.trim();
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/members/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ account, password })
            });

            const data = await res.json();

            if (!res.ok) {
                showError(data.error || '帳號或密碼錯誤');
                return;
            }

            // 驗證是否為 ADMIN 角色
            if (data.role !== 'ADMIN') {
                // 若為一般顧客誤闖，立即清除 Session 避免保留登入狀態
                await fetch('/api/members/logout', { method: 'POST' });
                showError('權限不足：此帳號非店家管理員，請從顧客端登入。');
                return;
            }

            // 驗證通過，跳轉至店家後台
            window.location.href = '/admin.html';
        } catch (err) {
            console.error(err);
            showError('網路連線異常，請稍後再試');
        }
    }

    function showError(msg) {
        const errorBox = document.getElementById('error-box');
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
    }
</script>

</body>
</html>
